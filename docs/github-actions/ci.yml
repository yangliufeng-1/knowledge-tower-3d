name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 校验数据
        run: npm run validate
      - name: 构建
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
